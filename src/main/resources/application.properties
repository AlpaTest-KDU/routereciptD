spring.application.name=RouteRecipt
server.port=8081



spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.0.123:3306/routereciptdb
spring.datasource.username=reciptback
spring.datasource.password=rainbow77&&**

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=30
mybatis.configuration.jdbc-type-for-null=VARCHAR
mybatis.configuration.call-setters-on-nulls=true
mybatis.configuration.auto-mapping-unknown-column-behavior=WARNING

# OpenAI \u00ec\u0084\u00a4\u00ec\u00a0\u0095
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4.1-mini

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.data.redis.host=redis-bloom
spring.data.redis.port=6379


logging.level.org.mybatis=DEBUG
logging.level.jdbc.sqlonly=DEBUG
logging.level.jdbc.resultset=DEBUG
logging.level.jdbc.audit=DEBUG