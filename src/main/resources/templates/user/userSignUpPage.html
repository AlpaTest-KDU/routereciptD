<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/signup.css}">
<title>Insert title here</title>
</head>
<body>
	<div layout:fragment="content">
	    
	    <div class="signUpArea">
	    
	    	<h2 class="signUpTitle">회원가입</h2>
	    	
	        <form th:action="@{/user/userSignUp}" th:object="${userDto}" method="post">
				<div>
					<label for="u_id">아이디</label>
					<input id="u_id" type="text" th:field="*{u_id}" th:errorclass="field-error" required oninput="validateField(this)">
					<span class="isValidMsg" th:if="${#fields.hasErrors('u_id')}" th:errors="*{u_id}"></span>
				</div>
				<div>
					<label for="u_pw">비밀번호</label>
					<input id="u_pw" type="password" th:field="*{u_pw}" th:errorclass="field-error" required oninput="checkSamePw()">
					<span class="isValidMsg" th:if="${#fields.hasErrors('u_pw')}" th:errors="*{u_pw}"></span>
				</div>
				<div>
					<label for="u_pw_confirm">비밀번호 확인</label>
					<input id="u_pw_confirm" type="password" name="u_pw_confirm" required oninput="checkSamePw()">
					<span id="pwConfirmMsg" style="color: red; display: none;"></span>
				</div>
				<div>
					<label for="u_name">이름</label>
	                <input id="u_name" type="text" th:field="*{u_name}" th:errorclass="field-error" required oninput="validateField(this)">
					<span class="isValidMsg" th:if="${#fields.hasErrors('u_name')}" th:errors="*{u_name}"></span>
	            </div>
	            <div>
	                <label for="u_birthday">생년월일</label>
	                <input id="u_birthday" type="date" th:field="*{u_birthday}" th:errorclass="field-error" required onchange="validateField(this)">
	                <span class="isValidMsg" th:if="${#fields.hasErrors('u_birthday')}" th:errors="*{u_birthday}"></span>
	            </div>
            	<div>
                	<label for="u_email">이메일</label>
                	<div>
                    	<input id="u_email" type="text" th:field="*{u_email}" th:errorclass="field-error" required oninput="validateField(this)">
                    	<span>@</span>
                    	<select name="emailDomain" required onchange="checkCustomDomain()">
                       		<option value="naver.com">naver.com</option>
                        	<option value="daum.net">daum.net</option>
                        	<option value="gmail.com">gmail.com</option>
                        	<option value="kakao.com">kakao.com</option>
                       	 	<option value="etc">직접입력</option>
                    	</select>
                	</div>
                	<span class="isValidMsg" th:if="${#fields.hasErrors('u_email')}" th:errors="*{u_email}"></span>
					<!-- required가 있으면 반드시 채워넣어야 하는데 직접입력 하지 않았을때 Hidden으로 되고
					 	 입력값을 받을 수 없어서 회원가입이 안되는 오류 발생하여 required 제거하고
					 	 javaScript로 해당 부분 조정 -->
                	<input id="emailCustom" type="text" name="emailDomainCustom">
            	</div>
	            <div>
	            	<span>성별</span>
	                <label for="gender">
	                	<input type="radio" th:field="*{gender}" value="MALE" th:errorclass="field-error" required onchange="validateField(this)">
	                	남성
	                </label>
	                <label for="gender">
	                	<input type="radio" th:field="*{gender}" value="FEMALE" th:errorclass="field-error" required onchange="validateField(this)">
	                	여성
	                </label>
	                <span class="isValidMsg" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
	            </div>
	            <div>
	            	 저희는 개인정보를 무단으로 사용하지 않습니다.
	            </div>
	            <button type="submit" id="signUpBtn">회원가입</button>
	        </form>
	    </div>

		<script>
			function checkCustomDomain() {
				const emailDomain = document.querySelector('select[name="emailDomain"]');
				const emailCustom = document.getElementById("emailCustom");

				// 이메일 도메인 직접입력시에만 입력 부분 보이도록
				if (emailDomain.value === "etc") {
					emailCustom.style.display = ""; // 보이게 설정 (CSS 기본값 사용)
					emailCustom.required = true;    // 필수 입력으로 변경
				} else {
					emailCustom.style.display = "none"; // 숨김
					emailCustom.required = false;       // 필수 입력 해제
					emailCustom.value = "";             // 값 초기화
				}
			}

			function checkSamePw() {
				const password = document.getElementById("u_pw");
				const passwordConfirm = document.getElementById("u_pw_confirm");
				const msg = document.getElementById("pwConfirmMsg");
				
				// 영문, 숫자, 특수문자(!@#$%^&*)를 각각 최소 1개 이상 포함, 6~24자
				const pwRegex = /^(?=.*[a-zA-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,24}$/;
				if (pwRegex.test(password.value)) {
					password.classList.remove('field-error');
					const pwErrorMsg = password.parentElement.querySelector('.isValidMsg');
					if (pwErrorMsg) pwErrorMsg.style.display = 'none';
				}

				if (passwordConfirm.value !== "" && password.value !== passwordConfirm.value) {
					msg.innerText = "비밀번호가 같지 않습니다"
					msg.style.display = "block";
				} else {
					msg.style.display = "none";
				}
			}
			
			function validateField(input) {
				const id = input.id;
				const value = input.value;
				let isValid = false;

				if (id === 'u_id') {
					// 아이디: 6~16자, 영문/숫자
					isValid = /^[a-zA-Z0-9]{6,16}$/.test(value);
				} else if (id === 'u_name' || id === 'u_email' || id === 'u_birthday') {
					isValid = value.trim().length > 0;
				} else if (input.name === 'gender') {
					isValid = true;
				}

				if (isValid) {
					input.classList.remove('field-error');
					// 에러 메시지 찾기 (부모, 조부모 순으로 탐색하여 .isValidMsg 찾기)
					let parent = input.parentElement;
					let msg = parent.querySelector('.isValidMsg');
					if (!msg && parent.parentElement) {
						msg = parent.parentElement.querySelector('.isValidMsg');
					}
					if (msg) msg.style.display = 'none';
				}
			}
		</script>
	</div>
</body>
</html>
