<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/base}">
<head>
<!-- 페이지 전용 CSS: base.html head로 주입됨 -->
<th:block layout:fragment="pageCss">
	<link rel="stylesheet" th:href="@{/css/login.css(v=1.0.0)}">
</th:block>
<title layout:fragment="pageTitle">로그인</title>
</head>
<body>
	<div layout:fragment="content">
	
		<div class="loginPage">
			<div class="loginCard">
				
				<h2 class="loginTitle">로그인</h2>
	
				<form action="/login" method="POST" class="loginForm">
					<div class="formRow">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label for="u_id">아이디</label>
						<input id="u_id" type="text" name="u_id">
					</div>
					
					<div class="formRow">
						<label for="u_pw">비밀번호</label>
						<input id="u_pw" type="password" name="u_pw">
					</div>
	
					<button type="submit" class="loginBtn">로그인</button>
				</form>
	
				<div class="loginBottom">
					<a th:href="@{/user/userFindIdPage}">아이디 찾기</a>
					<a th:href="@{/user/userResetPwPage}">비밀번호 재설정</a>
					<a th:href="@{/}">메인으로 돌아가기</a>
				</div>
				
				<div class="goSignup">
					<p>계정이 없으신가요?</p>
					<a th:href="@{/user/userSignUpPage}">회원가입하기</a>
				</div>
	
				<div th:if="${param.error}">
					<h6>로그인에 실패하였습니다. 아이디와 비밀번호를 확인해주세요.</h6>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
