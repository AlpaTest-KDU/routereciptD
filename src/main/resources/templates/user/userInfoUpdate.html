<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/index.css}">
<link rel="stylesheet" th:href="@{/css/userInfoUpdate.css}">
<title>Insert title here</title>
</head>
<body>

	<div layout:fragment="content">
	
		<div class="userInfoUpdateArea">
	    	<h2>회원정보 수정</h2>
	    	<form th:action="@{/userInfoShowPage/userInfoUpdate}" method="post">
				<div class="infoRow">
	        		<label>아이디</label>
	        		<span th:text="${u_id}"></span>
	      		</div>
	      		<div class="infoRow">
	        		<label for="new_pw">비밀번호</label>
	        		<input id="new_pw" type="password" name="new_pw">
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_name">이름</label>
	        		<input id="u_name" type="text" name="u_name" th:value="${u_name}">
	      		</div>
	      		<div class="infoRow">
	        		<label>생년월일</label>
	        		<span th:text="${u_birthday}"></span>
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_email">이메일</label>
	        		<input id="u_email" type="email" name="u_email" th:value="${u_email}">
	      		</div>
	      		<div class="infoRow">
	        		<label>성별</label>
	        		<span th:text="${gender}"></span>
	      		</div>
	      		<button type="submit" class="saveBtn">정보 수정</button>
			</form>
	
	    	<form th:action="@{/userInfoShowPage/userInfoDelete}" method="post">
	      		<button type="submit" class="deleteBtn">회원 탈퇴</button>
	    	</form>
		</div>
	
	</div>
</body>
</html>
