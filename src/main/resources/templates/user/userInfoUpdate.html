<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/userInfoUpdate.css}">
<script th:src="@{/js/userInfoDelete.js}" defer></script>
<title>Insert title here</title>
</head>
<body>

	<div layout:fragment="content">
	
		<div class="userInfoUpdateArea">
	    	<h2>회원정보 수정</h2>
	    	<form th:action="@{/user/userInfoUpdate}" method="post">
	    		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<div class="infoRow">
	        		<label>아이디</label>
	        		<input type="hidden" name="u_id" th:value="${u_id}">
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_name">이름</label>
	        		<input id="u_name" type="text" name="u_name" th:value="${u_name}">
	      		</div>
	      		<div class="infoRow">
	        		<label>생년월일</label>
	        		<span th:text="${u_birthday}"></span>
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_email">이메일</label>
	        		<input id="u_email" type="email" name="u_email" th:value="${u_email}">
	      		</div>
	      		<div class="infoRow">
	        		<label>성별</label>
	        		<span th:text="${gender}"></span>
	      		</div>
	      		<!-- 취소버튼 -->
	      		<button type="button" class="cancelBtn"
	      			onclick="location.href='[[@{/user/userInfoShowPage}]]'">취소</button>
	      		<button type="submit" class="saveBtn">회원정보수정</button>
			</form>
			
			<form th:action="@{/user/userResetPwPage}" method="GET">
	      		<div class="infoRow">
	    			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button type="submit" class="saveBtn">비밀번호 재설정</button>
	      		</div>
			</form>

	    	<form id="deleteForm" th:action="@{/user/userInfoDelete}" method="post">
				<input type="hidden" id="currentUserId" th:value="${u_id}">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	      		<button type="button" class="deleteBtn" onclick="confirmDelete()">회원 탈퇴</button>
	    	</form>
	    	
	    	<div style="border:2px solid red; padding:10px; margin-bottom:20px;">
    			<h3>DEBUG - USER MODEL CHECK</h3>
    			<p>u_id: <span th:text="${u_id}">없음</span></p>
    			<p>u_name: <span th:text="${u_name}">없음</span></p>
    			<p>u_email: <span th:text="${u_email}">없음</span></p>
    			<p>u_birthday: <span th:text="${u_birthday}">없음</span></p>
    			<p>gender: <span th:text="${gender}">없음</span></p>
			</div>
		</div>
		
	</div>
</body>
</html>
