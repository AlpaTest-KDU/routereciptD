<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/index.css}">
<link rel="stylesheet" th:href="@{/css/userInfoUpdate.css}">
<title>Insert title here</title>
</head>
<body>

	<div layout:fragment="content">
	
		<div class="userInfoUpdateArea">
	    	<h2>회원정보 수정</h2>
	    	<form th:action="@{/user/userInfoUpdate}" method="post">
				<div class="infoRow">
	        		<label>아이디</label>
	        		<span th:text="${u_id}"></span>
	      		</div>
	      		<div class="infoRow">
	        		<label for="new_pw">비밀번호</label>
	        		<input id="new_pw" type="password" name="u_pw">
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_name">이름</label>
	        		<input id="u_name" type="text" name="u_name" th:value="${u_name}">
	      		</div>
	      		<div class="infoRow">
	        		<label>생년월일</label>
	        		<span th:text="${u_birthday}"></span>
	      		</div>
	      		<div class="infoRow">
	        		<label for="u_email">이메일</label>
	        		<input id="u_email" type="email" name="u_email" th:value="${u_email}">
	      		</div>
	      		<div class="infoRow">
	        		<label>성별</label>
	        		<span th:text="${gender}"></span>
	      		</div>
	      		<button type="submit" class="saveBtn">정보 수정</button>
			</form>
	
	    	<form th:action="@{/user/userInfoDelete}" method="post">
				<input type="hidden" id="currentUserId" th:value="${u_id}">
	      		<button type="button" class="deleteBtn" onclick="confirmDelete()">회원 탈퇴</button>
	    	</form>

			<script th:inline="javascript">
				function confirmDelete() {
					const currentUserId = document.getElementById('currentUserId').value;
					const userInput = prompt("삭제하시려면 아이디('" + currentUserId + "')를 입력하세요.");
					if (userInput === null) {
						return;
					}

					if (userInput === currentUserId) {
						if (confirm("정말로 탈퇴하시겠습니까? 모든 정보가 삭제됩니다.")) {
							document.getElementById('deleteForm').submit();
						}
					} else {
						alert("아이디가 일치하지 않습니다.");
					}
				}
			</script>
		</div>
	</div>
</body>
</html>
