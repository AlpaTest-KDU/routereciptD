<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title>영수증 등록</title>
<!-- ✅ 기존에 만든 CSS -->
<link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body>

	<div layout:fragment="content">

		<div class="container" sec:authorize="isAuthenticated()">
		
			<div class="pageHeader">
      			<div class="pageHeaderArea">
        			<h2 class="pageTitle">
          				영수증 등록
        			</h2>
        			<p class="pageDesc">
          				영수증을 업로드하거나 직접 입력하여 지출을 분석해보세요.
        			</p>

        			<ul class="guideList">
          				<li>사진 한 장으로 자동 분석</li>
          				<li>항목별 수정 및 카테고리 분류 가능</li>
          				<li>OCR이 어려운 경우 수기 입력 지원</li>
        			</ul>
      			</div>

    		</div>
		
		    <!-- ===============================
		         1️⃣ OCR 업로드 (receipt.js 사용)
		    =============================== -->
		    <form id="uploadForm" th:action="@{/receipt/uploadReceipt}" method="post" enctype="multipart/form-data">
		    	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    			
    			<!-- 파일선택 + 직접 입력 -->
    			<div class="uploadLeft">
    				<input type="file" id="receiptFile" name="receipt" accept="image/*" multiple required>
    				<label for="receiptFile" class="customFileBtn">파일 선택</label>

					<!-- aria-live="polite": 파일명이 바뀌면 화면에 나옴 -->    				
					<div id="selectedFileNames" class="fileNameBox" aria-live="polite"> 
    					<span class="fileNamePlaceholder">선택된 파일 없음</span>
					</div>
    				
    				<button id="manualBtn" type="button" onclick="openManualModal()">직접 입력하기</button>
    			</div>
    			
		        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				
		        <button type="submit" class="ocrBtn">영수증 분석</button>
		    </form>
		
		    <!-- ===============================
		         2️⃣ OCR 결과 목록
		    =============================== -->
		    <div id="receiptList" class="receiptList" th:if="${receipts != null and !receipts.isEmpty()}">
		
		        <h3>영수증 목록</h3>
		
		        <div th:each="receipt, stat : ${receipts}">
		            <button type="button" class="receiptListNo" th:text="${stat.index + 1} + '번 - ' + receipt.r_place"
		                    th:onclick="|showReceipt(${stat.index})|">
		            </button>
		        </div>
		    </div>
		
		    <!-- ===============================
		         3️⃣ 선택 영수증 상세 + 확정
		    =============================== -->
		    <div id="detailArea" class="infoBox" style="display:none;">
		
		        <h3>기본 정보</h3>
		        <p>가게명: <span id="placeText"></span></p>
		        <p>날짜: <span id="dateText"></span></p>
		        <p>총액: <span id="priceText"></span>원</p>
		
		        <form id="confirmForm" th:action="@{/receipt/confirm}" method="post"
		              onsubmit="return beforeSubmitConfirm();">
		
		            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		            <!-- receipt.js가 채움 -->
		            <input type="hidden" name="r_no"    id="rNoInput">
		            <input type="hidden" name="r_place" id="rPlaceInput">
		            <input type="hidden" name="r_date"  id="rDateInput">
		            <input type="hidden" name="r_price" id="rPriceInput">
		
		            <h3>카테고리별 항목</h3>
		            <div id="categoryArea" class="categoryBox"></div>
		
		            <div class="btnRow">
		                <button type="button" onclick="recalcTotalToHidden()">
		                    총액 다시 계산
		                </button>
		                <button type="submit" class="uploadBtn">
		                    영수증 확정
		                </button>
		            </div>
		        </form>
		    </div>
		
		</div>
		
		<!-- ===============================
		     4️⃣ 수기 입력 모달
		=============================== -->
		<!-- <button id="manualBtn" onclick="openManualModal()">수기입력</button> -->
		<!-- 수기입력 버튼 옮겼습니다 -->
		
		<div id="manualModal" class="modal" data-modal-overlay>
			
			<!-- 모달 열리면 배경은 비활성화 -->
		    <div class="modalContent" role="dialog" aria-modal="true" aria-label="수기 영수증 입력">
		
		        <div class="modalHeader">
		            <h3>수기 영수증 입력</h3>
		            <button type="button" onclick="closeManualModal()">X</button>
		        </div>
		
		        <form id="manualForm" th:action="@{/receipt/saveOne}" method="post"
		              onsubmit="return beforeSubmitManualReceipt();">
		
		            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		            <div class="row">
		                <label>가게명</label>
		                <input type="text" name="r_place" required>
		            </div>
		
		            <div class="row">
		                <label>날짜</label>
		                <input type="date" name="r_date" required>
		            </div>
		
		            <div class="row">
		                <label>총액</label>
		                <input type="number" id="m_price" name="r_price" readonly>
		            </div>
		
		            <h4>상품 목록</h4>
		
		            <div class="itemInputRow">
		                <select id="m_category"></select>
		                <input type="text" id="m_itemName">
		                <input type="number" id="m_itemPrice">
		                <button type="button" onclick="addManualItem()">추가</button>
		            </div>
		
		            <table>
		                <tbody id="manualItemsBody"></tbody>
		            </table>
		
		            <div id="manualHiddenInputs"></div>
		
		            <div class="modalFooter">
		                <button type="submit">저장</button>
		                <button type="button" onclick="closeManualModal()">취소</button>
		            </div>
		
		        </form>
		    </div>
		</div>
		
		<!-- 로딩 중 화면 -->
		<div id="loadingOverlay" class="loadingOverlay" aria-hidden="true">
			<div class="loadingBox">
				<img th:src="@{/img/loading.gif}" alt="영수증 분석 중" class="loadingImage">
				<p class="loadingTitle">영수증을 분석 중입니다.</p>
				<p class="loadingDesc">OCR 분석에는 수 초가 걸릴 수 있습니다. <br>
				잠시만 기다려주세요.
				</p>
			</div>
		</div>
		
		<!-- ===============================
		     receipts → JS
		=============================== -->
		<!-- ===============================
     receipts → JS
=============================== -->
<div id="receiptData"
     th:data-receipts="${receiptsJson}">
</div>

<div>
<script>
  var receipts = [];
  (function () {
    var el = document.getElementById("receiptData");
    if (!el) return;

    var raw = el.getAttribute("data-receipts");
    if (!raw) {
      receipts = [];
      return;
    }

    try {
      receipts = JSON.parse(raw);
    } catch (e) {
      console.error("❌ receipts JSON parse error", e, raw);
      receipts = [];
    }
  })();
</script>

<!-- ✅ 기존에 만든 JS -->
<script th:src="@{/js/receipt.js(v=${#dates.createNow().time})}"></script>

		
		<!-- 모달창 바깥 클릭하면 닫기/esc로 닫기 관련 스크립트 -->
		<script>
  		(function initManualModalUX() {
			const modal = document.getElementById("manualModal");
    		if (!modal) return;

    		modal.addEventListener("click", (e) => {
      		if (e.target === modal) closeManualModal();
    		});

    		document.addEventListener("keydown", (e) => {
      			if (e.key !== "Escape") return;
      			const isOpen = getComputedStyle(modal).display !== "none";
      			if (isOpen) closeManualModal();
    		});
  		})();
  		</script>
  		
  		<!-- 로딩창 제어 -->
		<script>
    	(function initLoading() {
      		const form = document.getElementById("uploadForm");
      		const overlay = document.getElementById("loadingOverlay");
      		const btn = document.querySelector(".ocrBtn");

      		if (!form || !overlay || !btn) return;

      		form.addEventListener("submit", () => {
        	overlay.classList.add("isOpen");
        	overlay.setAttribute("aria-hidden", "false");
        	document.body.classList.add("isLoading");
        	btn.disabled = true;
        	btn.textContent = "분석 중...";
      		});
    	})();
  		</script>
  		
  		<!-- 파일명 나오게 하는 스크립트 -->
  		<script>
  		(function initSelectedFileNames() {
  		  const input = document.getElementById("receiptFile");
  		  const box = document.getElementById("selectedFileNames");
  		  if (!input || !box) return;

  		  function render(files) {
  		    box.innerHTML = "";

  		    if (!files || files.length === 0) {
  		      const span = document.createElement("span");
  		      span.className = "fileNamePlaceholder";
  		      span.textContent = "선택된 파일 없음";
  		      box.appendChild(span);
  		      return;
  		    }

  		    // 너무 많이 선택했을 때 UI 깨짐 방지: 앞의 2개만 보여주고 나머지는 +n개
  		    const MAX_SHOW = 2;
  		    const list = document.createElement("div");
  		    list.className = "fileNameList";

  		    const shown = Array.from(files).slice(0, MAX_SHOW);
  		    shown.forEach((f) => {
  		      const chip = document.createElement("span");
  		      chip.className = "fileChip";
  		      chip.title = f.name; // 마우스 올리면 전체 이름
  		      chip.textContent = f.name;
  		      list.appendChild(chip);
  		    });

  		    if (files.length > MAX_SHOW) {
  		      const more = document.createElement("span");
  		      more.className = "fileMore";
  		      more.textContent = `+${files.length - MAX_SHOW}개`;
  		      list.appendChild(more);
  		    }

  		    box.appendChild(list);
  		  }

  		  // 최초 1회 렌더(혹시 값이 남아있는 케이스)
  		  render(input.files);

  		  // 파일 선택 시 업데이트
  		  input.addEventListener("change", () => {
  		    render(input.files);
  		  });

  		  // 폼 submit 후 페이지가 그대로 남는 환경(ajax 등) 대비: 필요 시 reset 처리 가능
  		})();
		
  		</script>
  		
  		<!-- 무한 로딩 방지 init()종료 함수 -->
  		<script>
			window.addEventListener("load", function () {
  				const overlay = document.getElementById("loadingOverlay");
  				const btn = document.querySelector(".ocrBtn");

  			if (overlay) {
   			 	overlay.classList.remove("isOpen");
   				overlay.setAttribute("aria-hidden", "true");
    			document.body.classList.remove("isLoading");
  			}

  			if (btn) {
    		btn.disabled = false;
    		btn.textContent = "영수증 분석";
  			}
		});
		</script>
  		
  		
	</div>
	
</body>
</html>
