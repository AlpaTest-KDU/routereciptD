<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>영수증 등록</title>

    <!-- ✅ 기존에 만든 CSS -->
    <link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>

<body>

<div class="container" sec:authorize="isAuthenticated()">

    <h2>영수증 등록</h2>

    <!-- ===============================
         1️⃣ OCR 업로드 (receipt.js 사용)
    =============================== -->
    <form id="uploadForm"
          th:action="@{/receipt/uploadReceipt}"
          method="post"
          enctype="multipart/form-data">

        <input type="file"
               id="receiptFile"
               name="receipt"
               accept="image/*"
               required>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <button type="submit">영수증 분석</button>
    </form>

    <!-- ===============================
         2️⃣ OCR 결과 목록
    =============================== -->
    <div id="receiptList"
         class="receipt-list"
         th:if="${receipts != null and !receipts.isEmpty()}">

        <h3>영수증 목록</h3>

        <div th:each="receipt, stat : ${receipts}">
            <button type="button"
                    class="receipt-btn"
                    th:text="${stat.index + 1} + '번 - ' + ${receipt.r_place}"
                    th:onclick="|showReceipt(${stat.index})|">
            </button>
        </div>
    </div>

    <!-- ===============================
         3️⃣ 선택 영수증 상세 + 확정
    =============================== -->
    <div id="detailArea" class="info-box" style="display:none;">

        <h3>기본 정보</h3>
        <p>가게명: <span id="placeText"></span></p>
        <p>날짜: <span id="dateText"></span></p>
        <p>총액: <span id="priceText"></span>원</p>

        <form id="confirmForm"
              th:action="@{/receipt/confirm}"
              method="post"
              onsubmit="return beforeSubmitConfirm();">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <!-- receipt.js가 채움 -->
            <input type="hidden" name="r_no"    id="rNoInput">
            <input type="hidden" name="r_place" id="rPlaceInput">
            <input type="hidden" name="r_date"  id="rDateInput">
            <input type="hidden" name="r_price" id="rPriceInput">

            <h3>카테고리별 항목</h3>
            <div id="categoryArea" class="category-box"></div>

            <div class="btn-row">
                <button type="button" onclick="recalcTotalToHidden()">
                    총액 다시 계산
                </button>
                <button type="submit">
                    영수증 확정
                </button>
            </div>
        </form>
    </div>

</div>

<!-- ===============================
     4️⃣ 수기 입력 모달
=============================== -->
<button id="manualBtn" onclick="openManualModal()">수기입력</button>

<div id="manualModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h3>수기 영수증 입력</h3>
            <button type="button" onclick="closeManualModal()">X</button>
        </div>

        <form id="manualForm"
              th:action="@{/receipt/saveOne}"
              method="post"
              onsubmit="return beforeSubmitManualReceipt();">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="row">
                <label>가게명</label>
                <input type="text" name="r_place" required>
            </div>

            <div class="row">
                <label>날짜</label>
                <input type="date" name="r_date" required>
            </div>

            <div class="row">
                <label>총액</label>
                <input type="number" id="m_price" name="r_price" readonly>
            </div>

            <h4>상품 목록</h4>

            <div class="item-input-row">
                <select id="m_category"></select>
                <input type="text" id="m_itemName">
                <input type="number" id="m_itemPrice">
                <button type="button" onclick="addManualItem()">추가</button>
            </div>

            <table>
                <tbody id="manualItemsBody"></tbody>
            </table>

            <div id="manualHiddenInputs"></div>

            <div class="modal-footer">
                <button type="submit">저장</button>
                <button type="button" onclick="closeManualModal()">취소</button>
            </div>

        </form>
    </div>
</div>

<!-- ===============================
     receipts → JS
=============================== -->
<script th:inline="javascript">
/*<![CDATA[*/
const receipts = /*[[${receipts}]]*/ [];
/*]]>*/
</script>

<!-- ✅ 기존에 만든 JS -->
<script th:src="@{/js/receipt.js}"></script>

</body>
</html>
