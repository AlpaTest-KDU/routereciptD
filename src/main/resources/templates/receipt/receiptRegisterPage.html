<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title>영수증 등록</title>
<!-- ✅ 기존에 만든 CSS -->
<link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body>

	<div layout:fragment="content">

		<div class="container" sec:authorize="isAuthenticated()">
		
			<div class="pageHeader">
      			<div class="pageHeaderArea">
        			<h2 class="pageTitle">
          				영수증 등록
        			</h2>
        			<p class="pageDesc">
          				영수증을 업로드하거나 직접 입력하여 지출을 분석해보세요.
        			</p>

        			<ul class="guideList">
          				<li>사진 한 장으로 자동 분석</li>
          				<li>항목별 수정 및 카테고리 분류 가능</li>
          				<li>OCR이 어려운 경우 수기 입력 지원</li>
        			</ul>
      			</div>

    		</div>
		
		    <!-- ===============================
		         1️⃣ OCR 업로드 (receipt.js 사용)
		    =============================== -->
		    <form id="uploadForm" th:action="@{/receipt/uploadReceipt}" method="post" enctype="multipart/form-data">
		    	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    			
    			<!-- 파일선택 + 직접 입력 -->
    			<div class="uploadLeft">
    				<input type="file" id="receiptFile" name="receipt" accept="image/*" multiple required>
    				<label for="receiptFile" class="customFileBtn">파일 선택</label>
    				
    				<button id="manualBtn" type="button" onclick="openManualModal()">직접 입력하기</button>
    			</div>
    			
		        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				
		        <button type="submit" class="ocrBtn">영수증 분석</button>
		    </form>
		
		    <!-- ===============================
		         2️⃣ OCR 결과 목록
		    =============================== -->
		    <div id="receiptList" class="receiptList" th:if="${receipts != null and !receipts.isEmpty()}">
		
		        <h3>영수증 목록</h3>
		
		        <div th:each="receipt, stat : ${receipts}">
		            <button type="button" class="receiptListNo" th:text="${stat.index + 1} + '번 - ' + ${receipt.r_place}"
		                    th:onclick="|showReceipt(${stat.index})|">
		            </button>
		        </div>
		    </div>
		
		    <!-- ===============================
		         3️⃣ 선택 영수증 상세 + 확정
		    =============================== -->
		    <div id="detailArea" class="infoBox" style="display:none;">
		
		        <h3>기본 정보</h3>
		        <p>가게명: <span id="placeText"></span></p>
		        <p>날짜: <span id="dateText"></span></p>
		        <p>총액: <span id="priceText"></span>원</p>
		
		        <form id="confirmForm" th:action="@{/receipt/confirm}" method="post"
		              onsubmit="return beforeSubmitConfirm();">
		
		            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		            <!-- receipt.js가 채움 -->
		            <input type="hidden" name="r_no"    id="rNoInput">
		            <input type="hidden" name="r_place" id="rPlaceInput">
		            <input type="hidden" name="r_date"  id="rDateInput">
		            <input type="hidden" name="r_price" id="rPriceInput">
		
		            <h3>카테고리별 항목</h3>
		            <div id="categoryArea" class="categoryBox"></div>
		
		            <div class="btnRow">
		                <button type="button" onclick="recalcTotalToHidden()">
		                    총액 다시 계산
		                </button>
		                <button type="submit" class="uploadBtn">
		                    영수증 확정
		                </button>
		            </div>
		        </form>
		    </div>
		
		</div>
		
		<!-- ===============================
		     4️⃣ 수기 입력 모달
		=============================== -->
		<!-- <button id="manualBtn" onclick="openManualModal()">수기입력</button> -->
		<!-- 수기입력 버튼 옮겼습니다 -->
		
		<div id="manualModal" class="modal" data-modal-overlay>
			
			<!-- 모달 열리면 배경은 비활성화 -->
		    <div class="modalContent" role="dialog" aria-modal="true" aria-label="수기 영수증 입력">
		
		        <div class="modalHeader">
		            <h3>수기 영수증 입력</h3>
		            <button type="button" onclick="closeManualModal()">X</button>
		        </div>
		
		        <form id="manualForm" th:action="@{/receipt/saveOne}" method="post"
		              onsubmit="return beforeSubmitManualReceipt();">
		
		            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		            <div class="row">
		                <label>가게명</label>
		                <input type="text" name="r_place" required>
		            </div>
		
		            <div class="row">
		                <label>날짜</label>
		                <input type="date" name="r_date" required>
		            </div>
		
		            <div class="row">
		                <label>총액</label>
		                <input type="number" id="m_price" name="r_price" readonly>
		            </div>
		
		            <h4>상품 목록</h4>
		
		            <div class="itemInputRow">
		                <select id="m_category"></select>
		                <input type="text" id="m_itemName">
		                <input type="number" id="m_itemPrice">
		                <button type="button" onclick="addManualItem()">추가</button>
		            </div>
		
		            <table>
		                <tbody id="manualItemsBody"></tbody>
		            </table>
		
		            <div id="manualHiddenInputs"></div>
		
		            <div class="modalFooter">
		                <button type="submit">저장</button>
		                <button type="button" onclick="closeManualModal()">취소</button>
		            </div>
		
		        </form>
		    </div>
		</div>
		
		<!-- ===============================
		     receipts → JS
		=============================== -->
		<script th:inline="javascript">
		/*<![CDATA[*/
		const receipts = /*[[${receipts}]]*/ [];
		/*]]>*/
		</script>
		
		<!-- ✅ 기존에 만든 JS -->
		<script th:src="@{/js/receipt.js}"></script>
		
		<!-- 모달창 바깥 클릭하면 닫기/esc로 닫기 관련 스크립트 -->
		<script>
  		(function initManualModalUX() {
			const modal = document.getElementById("manualModal");
    		if (!modal) return;

    		modal.addEventListener("click", (e) => {
      		if (e.target === modal) closeManualModal();
    		});

    		document.addEventListener("keydown", (e) => {
      			if (e.key !== "Escape") return;
      			const isOpen = getComputedStyle(modal).display !== "none";
      			if (isOpen) closeManualModal();
    		});
  		})();
  		</script>
	
	</div>
	
</body>
</html>
