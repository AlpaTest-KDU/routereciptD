<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <th:block layout:fragment="pageCss">
    <link rel="stylesheet" th:href="@{/css/receipt.css(v=1.0.0)}">
  </th:block>
  <title layout:fragment="pageTitle">영수증 등록</title>
</head>
<body>

<div layout:fragment="content">

  <div class="container" sec:authorize="isAuthenticated()">

    <!-- HEADER -->
    <div class="pageHeader">
      <div class="pageHeaderArea">
        <h2 class="pageTitle">영수증 등록</h2>
        <p class="pageDesc">영수증을 업로드하거나 직접 입력하여 지출을 분석해보세요.</p>
        <ul class="guideList">
          <li>사진 한 장으로 자동 분석</li>
          <li>항목별 수정 및 카테고리 분류 가능</li>
          <li>OCR이 어려운 경우 수기 입력 지원</li>
        </ul>
      </div>
    </div>

    <!-- OCR 업로드 -->
    <form id="uploadForm"
          th:action="@{/receipt/uploadReceipt}"
          method="post"
          enctype="multipart/form-data">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}"/>

      <div class="uploadLeft">
        <input type="file" id="receiptFile" name="receipt" accept="image/*" multiple required>
        <label for="receiptFile" class="customFileBtn">파일 선택</label>

        <div id="selectedFileNames" class="fileNameBox">
          <span class="fileNamePlaceholder">선택된 파일 없음</span>
        </div>

        <button type="button" id="manualBtn" onclick="openManualModal()">직접 입력하기</button>
      </div>

      <button type="button" class="ocrBtn" onclick="submitUpload()">영수증 분석</button>
    </form>

    <!-- 상세 영역 -->
    <div id="detailArea" class="infoBox" style="display:none;">
      <h3>기본 정보</h3>
      <p>가게명: <span id="placeText"></span></p>
      <p>날짜: <span id="dateText"></span></p>
      <p>총액: <span id="priceText"></span>원</p>

      <form id="confirmForm"
            th:action="@{/receipt/confirm}"
            method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="r_no"    id="rNoInput">
        <input type="hidden" name="r_place" id="rPlaceInput">
        <input type="hidden" name="r_date"  id="rDateInput">
        <input type="hidden" name="r_price" id="rPriceInput">

        <h3>카테고리별 항목</h3>
        <div id="categoryArea" class="categoryBox"></div>

        <div class="btnRow">
          <button type="submit" class="uploadBtn">영수증 확정</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===============================
       수기 입력 모달
  =============================== -->
  <div id="manualModal" class="modal" aria-hidden="true">
    <div class="modalContent">

      <div class="modalHeader">
        <h3>영수증 수기 입력</h3>
        <button type="button" onclick="closeManualModal()">X</button>
      </div>

      <form id="manualForm" onsubmit="return submitManualForm();">

        <div class="row">
          <label>상호명</label>
          <input type="text" id="manualPlaceInput" required>
        </div>

        <div class="row">
          <label>날짜</label>
          <input type="date" id="manualDateInput">
        </div>

        <h4>상품 추가</h4>

        <div class="itemInputRow">
          <select id="manualCategorySelect">
            <option value="식비">식비</option>
            <option value="카페">카페</option>
            <option value="편의점">편의점</option>
            <option value="기타">기타</option>
          </select>
          <input type="text" id="manualItemName" placeholder="상품명">
          <input type="number" id="manualItemPrice" min="0" placeholder="가격">
          <button type="button" onclick="addManualItem()">추가</button>
        </div>

        <table>
          <tbody id="manualItemTable"></tbody>
        </table>

        <div class="modalFooter">
          <button type="button" onclick="closeManualModal()">취소</button>
          <button type="submit" class="uploadBtn">등록</button>
        </div>

      </form>
    </div>
  </div>

  <script th:src="@{/js/receipt.js(v=${#dates.createNow().time})}"></script>
</div>

</body>
</html>
