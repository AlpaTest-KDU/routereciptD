<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title>영수증 등록</title>
<link rel="stylesheet" th:href="@{/css/receipt.css}">
</head>
<body>

<div layout:fragment="content">

  <div class="container" sec:authorize="isAuthenticated()">

    <!-- ===============================
         HEADER
    =============================== -->
    <div class="pageHeader">
      <div class="pageHeaderArea">
        <h2 class="pageTitle">영수증 등록</h2>
        <p class="pageDesc">영수증을 업로드하거나 직접 입력하여 지출을 분석해보세요.</p>
        <ul class="guideList">
          <li>사진 한 장으로 자동 분석</li>
          <li>항목별 수정 및 카테고리 분류 가능</li>
          <li>OCR이 어려운 경우 수기 입력 지원</li>
        </ul>
      </div>
    </div>

    <!-- ===============================
         1️⃣ OCR 업로드
    =============================== -->
    <form id="uploadForm"
          action="/receipt/uploadReceipt"
          method="post"
          enctype="multipart/form-data">
          
          <input type="hidden"
         th:name="${_csrf.parameterName}"
         th:value="${_csrf.token}"/>

      <div class="uploadLeft">
        <input type="file"
               id="receiptFile"
               name="receipt"
               accept="image/*"
               multiple
               required>

        <label for="receiptFile" class="customFileBtn">파일 선택</label>

        <div id="selectedFileNames" class="fileNameBox" aria-live="polite">
          <span class="fileNamePlaceholder">선택된 파일 없음</span>
        </div>

        <button type="button" id="manualBtn" onclick="openManualModal()">직접 입력하기</button>
      </div>

      <button type="submit" class="ocrBtn">영수증 분석</button>
    </form>

    <!-- ===============================
         2️⃣ OCR 결과 목록
    =============================== -->
    <div id="receiptList"
         class="receiptList"
         th:if="${receipts != null and !receipts.isEmpty()}">

      <h3>영수증 목록</h3>

      <div th:each="receipt, stat : ${receipts}">
        <button type="button"
                class="receiptListNo"
                th:text="${stat.index + 1} + '번 - ' + receipt.r_place"
                th:onclick="|showReceipt(${stat.index})|">
        </button>
      </div>
    </div>

    <!-- ===============================
         3️⃣ 상세 + 확정
    =============================== -->
    <div id="detailArea" class="infoBox" style="display:none;">

      <h3>기본 정보</h3>
      <p>가게명: <span id="placeText"></span></p>
      <p>날짜: <span id="dateText"></span></p>
      <p>총액: <span id="priceText"></span>원</p>

      <form id="confirmForm"
            th:action="@{/receipt/confirm}"
            method="post"
            onsubmit="return beforeSubmitConfirm();">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <input type="hidden" name="r_no" id="rNoInput">
        <input type="hidden" name="r_place" id="rPlaceInput">
        <input type="hidden" name="r_date" id="rDateInput">
        <input type="hidden" name="r_price" id="rPriceInput">

        <h3>카테고리별 항목</h3>
        <div id="categoryArea" class="categoryBox"></div>

        <div class="btnRow">
          <button type="button" onclick="recalcTotalToHidden()">총액 다시 계산</button>
          <button type="submit" class="uploadBtn">영수증 확정</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===============================
       로딩 오버레이
  =============================== -->
  <div id="loadingOverlay" class="loadingOverlay" aria-hidden="true">
    <div class="loadingBox">
      <img th:src="@{/img/loading.gif}" alt="영수증 분석 중">
      <p class="loadingTitle">영수증을 분석 중입니다.</p>
      <p class="loadingDesc">잠시만 기다려주세요.</p>
    </div>
  </div>

  <!-- receipts JSON -->
  <div id="receiptData" th:data-receipts="${receiptsJson}"></div>

  <script>
    var receipts = [];
    (function () {
      const el = document.getElementById("receiptData");
      if (!el) return;
      const raw = el.getAttribute("data-receipts");
      if (!raw) return;
      try { receipts = JSON.parse(raw); }
      catch (e) { receipts = []; }
    })();
  </script>

  <script th:src="@{/js/receipt.js(v=${#dates.createNow().time})}"></script>

  <!-- 로딩 제어 -->
  <script>
    (function () {
      const form = document.getElementById("uploadForm");
      const overlay = document.getElementById("loadingOverlay");
      const btn = document.querySelector(".ocrBtn");

      if (!form || !overlay || !btn) return;

      form.addEventListener("submit", () => {
        overlay.classList.add("isOpen");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("isLoading");
        btn.disabled = true;
        btn.textContent = "분석 중...";
      });
    })();

    // ✅ 에러/리다이렉트 포함 모든 경우에서 로딩 해제
    window.addEventListener("pageshow", function () {
      const overlay = document.getElementById("loadingOverlay");
      const btn = document.querySelector(".ocrBtn");

      if (overlay) {
        overlay.classList.remove("isOpen");
        overlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("isLoading");
      }
      if (btn) {
        btn.disabled = false;
        btn.textContent = "영수증 분석";
      }
    });
  </script>

</div>
</body>
</html>
