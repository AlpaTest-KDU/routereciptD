<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="header">
	<script th:src="@{/js/logout.js}" defer></script>
	<div class="logo">
	<a th:href="@{/}" class="logoText">Routereceipt</a>
	</div>
	<nav class="navbar">
		<a sec:authorize="hasRole('USER')" th:href="@{/receipt/receiptRegisterPage}" class="navbarMenu">영수증 등록</a>
		<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/adminPage}" class="navbarMenu">관리자 페이지</a>
		<a th:href="@{/user/analysisPage}" class="navbarMenu">지출 분석</a>
		<a th:href="@{/notice/noticePage}" class="navbarMenu">공지 사항</a>
		<!-- <a sec:authorize="hasRole('USER')" th:href="@{/user/userInfoShowPage}" class="navbarMenu">마이페이지</a> -->
		<a sec:authorize="isAnonymous()" th:href="@{/user/userLoginPage}" class="navbarBtn">로그인</a>
		<a sec:authorize="isAnonymous()" th:href="@{/user/userSignUpPage}" class="navbarBtn">회원가입</a>
		<!-- 로그인 완료한 유저 -->
		<div sec:authorize="isAuthenticated()" class="account">
			<button type="button" class="accountBtn" aria-haspopup="true" aria-expanded="false" id="accountBtn">
				<span class="accountName" sec:authentication="name"></span>님
				<span class="accountCaret" aria-hidden="true">▾</span>
			</button>
			<!-- 드롭다운 -->
			<div class="accountMenu" role="menu">
				<a th:href="@{/user/userInfoShowPage}" class="accountItem" role="menuitem">마이페이지</a>
				<form id="headerLogoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>
				<button type="button" class="accountItem danger" onclick="confirmLogout('headerLogoutForm');" role="menuitem">로그아웃</button>
			</div>
		</div>
		<!-- <span sec:authorize="isAuthenticated()" sec:authentication="name" class="navbarUser"></span>님 -->
		<!-- <form sec:authorize="isAuthenticated()" id="headerLogoutForm" th:action="@{/logout}" method="post" style="display:none;"></form> -->
		<!-- <a sec:authorize="isAuthenticated()" href="javascript:void(0);" onclick="confirmLogout('headerLogoutForm');" class="navbarMenu navbarLogout">로그아웃</a> -->
	</nav>
</header>
