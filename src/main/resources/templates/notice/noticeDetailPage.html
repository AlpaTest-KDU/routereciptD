<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
<th:block layout:fragment="pageCss">
	<link rel="stylesheet" th:href="@{/css/noticePage.css(v=1.0.0)}">
</th:block>
<title layout:fragment="pageTitle">공지사항</title>
</head>
<body>

	<div layout:fragment="content">
	
	    <section class="noticeContainer">
	        <div class="noticeDetailHeader">
	            <div>
	                <h2 class="noticeDetailTitle" th:text="${notice.n_title}">
	                    공지사항 제목
	                </h2>
	                <p class="noticeDetailInfo">
	                	<span th:text="${notice.n_writer}">관리자</span>
	                	<span th:text="${#dates.format(notice.n_create, 'yyyy-MM-dd')}">2025.12.24</span>
	                </p>
	            </div>
	        </div>
	
	        <div class="noticeDetailContent"
	             th:text="${notice.n_content}">
	            공지사항 내용
	        </div>
	
	        <div class="noticeDetailActions">
	            <a class="btnBack" th:href="@{/notice/noticePage}">목록으로</a>
	        </div>
	    </section>
	
	</div>

</body>
</html>
