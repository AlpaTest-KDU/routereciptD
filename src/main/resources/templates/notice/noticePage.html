<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	  layout:decorate="~{layout/base}">
<head>
<th:block layout:fragment="pageCss">
	<link rel="stylesheet" th:href="@{/css/noticePage.css(v=1.0.0)}">
</th:block>
<title layout:fragment="pageTitle">공지사항</title>
</head>
<body>
	<div layout:fragment="content">
	
		<section class="noticeContainer">
			<div class="noticeHeader">
				<div>
					<h2 class="noticeTitle">공지사항</h2>
					<p>Routeceipt 서비스 이용과 관련된 주요 안내사항입니다.</p>
				</div>
				
<!--┌─────────────────────────────────────────────────────────────────────────────┐ -->
<!--│				           관리자 - 공지 사항 작성 버튼							  │ -->
<!--└─────────────────────────────────────────────────────────────────────────────┘ -->
      			<div sec:authorize="hasAuthority('ROLE_ADMIN')">
        			<a class="btnWrite" th:href="@{/notice/noticeRegisterPage}">공지 작성</a>
      			</div>
<!--┌─────────────────────────────────────────────────────────────────────────────┐ -->
<!--│				           관리자 - 공지 사항 작성 버튼							  │ -->
<!--└─────────────────────────────────────────────────────────────────────────────┘ -->				 
			
			</div>
			
			<table class="noticeTable">
				<thead>
					<tr>
						<th>번호</th>
						<th>제목</th>
						<th>작성자</th>
						<th>작성일</th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="notice : ${noticeList}">
						<td class="tdNo" th:text="${notice.n_id}"></td>
						<td class="tdTitle">
							<a th:href="@{/notice/noticeDetailPage(n_id=${notice.n_id})}" th:text="${notice.n_title}"></a>
						</td>
						<td class="tdWriter" th:text="${notice.n_writer}"></td>
						<td class="tdCreateTime" th:text="${#dates.format(notice.n_create, 'yyyy-MM-dd')}"></td>
					</tr>
					<tr th:if="${#lists.isEmpty(noticeList)}">
						<td class="empty" colspan="4">등록된 공지사항이 없습니다.</td>
					</tr>
				</tbody>
			</table>
			
			<!-- 페이지네이션 추가 -->
			<div class="pagination" th:if="${page != null and page.total > 0}" style="display: flex; justify-content: center; margin-top: 20px; gap: 10px;">
				
				<!-- 이전 버튼 -->
				<a th:if="${page.prev}" 
				   th:href="@{/notice/noticePage(pageNum=${page.startPage - 1}, amount=${page.criteria.amount})}" 
				   class="pageBtn pageNav">&lt; 이전</a>

				<!-- 페이지 번호 -->
				<th:block th:each="num : ${#numbers.sequence(page.startPage, page.endPage)}">
					<a th:href="@{/notice/noticePage(pageNum=${num}, amount=${page.criteria.amount})}" 
					   th:text="${num}"
					   class="pageBtn pageNum"
					   th:style="${page.criteria.pageNum == num ? 'font-weight: bold; text-decoration: underline;' : ''}"></a>
				</th:block>

				<!-- 다음 버튼 -->
				<a th:if="${page.next}" 
				   th:href="@{/notice/noticePage(pageNum=${page.endPage + 1}, amount=${page.criteria.amount})}" 
				   class="pageBtn pagenNav">다음 &gt;</a>
			</div>
			
		</section>
		
	</div>
</body>
</html>
