version: "3.8"

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: Vheh150630!
      MYSQL_DATABASE: routereciptdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis-bloom:
    image: redislabs/rebloom:latest
    container_name: redis-bloom
    ports:
      - "6379:6379"
    restart: unless-stopped

  springboot:
    build: .
    container_name: springboot
    depends_on:
      - mariadb
      - redis-bloom
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/routereciptdb
      SPRING_DATASOURCE_USERNAME: Receiptbaack
      SPRING_DATASOURCE_PASSWORD: Rainbow77&&**
      SPRING_DATA_REDIS_HOST: redis-bloom
      SPRING_DATA_REDIS_PORT: 6379
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - springboot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    restart: always

volumes:
  db_data:
