version: "3.8"

services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: Vheh150630!
      MYSQL_DATABASE: routereciptdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  redis-bloom:
    image: redislabs/rebloom:latest
    container_name: redis-bloom
    ports:
      - "6379:6379"
    restart: always

  springboot-blue:
    build: .
    container_name: springboot-blue
    depends_on:
      - mariadb
      - redis-bloom
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/routereciptdb
      SPRING_DATASOURCE_USERNAME: reciptback
      SPRING_DATASOURCE_PASSWORD: rainbow77&&**
      SPRING_DATA_REDIS_HOST: redis-bloom
      SPRING_DATA_REDIS_PORT: 6379
      OPENAI_API_KEY: "${OPENAI_API_KEY}"   # 추가
    restart: unless-stopped

  springboot-green:
    build: .
    container_name: springboot-green
    depends_on:
      - mariadb
      - redis-bloom
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/routereciptdb
      SPRING_DATASOURCE_USERNAME: reciptback
      SPRING_DATASOURCE_PASSWORD: rainbow77&&**
      SPRING_DATA_REDIS_HOST: redis-bloom
      SPRING_DATA_REDIS_PORT: 6379
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    restart: unless-stopped

volumes:
  db_data:
