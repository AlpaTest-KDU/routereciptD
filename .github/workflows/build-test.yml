name: Build & Test (routereciptD)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RouteRecipt   # <<<<<< 핵심!!!!! gradlew 있는 폴더

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build & Test with Gradle
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Upload Test Reports (JUnit)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: RouteRecipt/build/reports/tests/test
